name: PyGo Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-dev pkg-config
      - name: Build and test native runtime
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPYGO_BUILD_SHARED=ON -DPYGO_BUILD_TESTS=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Test Go ecosystem
        run: go test ./...
      - name: Test Python ecosystem
        run: |
          python -m pip install -e . --no-deps
          python -m compileall -q python
          python -m pytest tests/python -q
      - name: Build Python wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Install native runtime
        run: cmake --install build --prefix "$RUNNER_TEMP/pygo"
      - name: Package source and native release
        run: |
          mkdir -p release/native
          cp build/libpygo.so cpp/release/native/
          cp cpp/bridge/c_api.h cpp/release/native/
          cp dist/*.whl cpp/release/native/
          tar -czf "release/pygo-${GITHUB_REF_NAME}.tar.gz" --exclude=build --exclude=.git .
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.tar.gz
            cpp/release/native/*
