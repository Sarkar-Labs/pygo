name: PyGo CI

on:
  push:
  pull_request:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPYGO_BUILD_SHARED=ON -DPYGO_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install smoke test
        run: cmake --install build --prefix "$RUNNER_TEMP/pygo"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . --no-deps
      - run: python -m compileall -q python
      - run: python -m pytest tests/python -q
      - run: python -m pip wheel . --no-deps -w dist

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install Python development headers
        run: sudo apt-get update && sudo apt-get install -y python3-dev pkg-config
      - name: Build native library
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPYGO_BUILD_SHARED=ON -DPYGO_BUILD_TESTS=ON
          cmake --build build --parallel 2
      - name: Test Go ecosystem
        run: go test ./...

