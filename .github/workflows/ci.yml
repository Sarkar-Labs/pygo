name: PyGo CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native CPU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPYGO_ENABLE_CUDA=OFF -DPYGO_BUILD_SHARED=ON -DPYGO_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install smoke test
        run: cmake --install build --prefix "$RUNNER_TEMP/pygo"

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . --no-deps
      - run: python -m compileall -q python
      - run: python -m pytest tests/python -q
      - run: python -m pip wheel . --no-deps -w dist

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-dev pkg-config
      - name: Build native library
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPYGO_ENABLE_CUDA=OFF -DPYGO_BUILD_SHARED=ON -DPYGO_BUILD_TESTS=ON
          cmake --build build --parallel 2
          cmake --install build --prefix "$RUNNER_TEMP/pygo"
      - name: Test Go ecosystem
        env:
          CGO_LDFLAGS: "-L${{ runner.temp }}/pygo/lib -Wl,-rpath,${{ runner.temp }}/pygo/lib"
          LD_LIBRARY_PATH: "${{ runner.temp }}/pygo/lib"
        run: go test ./...
